<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Battle: Leaderboard</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --panel-bg: #1e2436;
      --panel-border: #333d59;
      --text-main: #ffffff;
      --text-muted: #8b99b5;

      --gold-start: #f4d03f;
      --gold-end: #16a085; /* fallback */
      --gold-bg: linear-gradient(135deg, #f39c12, #f1c40f);
      --gold-border: #f1c40f;

      --team1-bg: linear-gradient(180deg, #d35400, #c0392b);
      --team1-border: #e74c3c;

      --team2-bg: linear-gradient(180deg, #2980b9, #2c3e50);
      --team2-border: #3498db;

      --team3-bg: linear-gradient(180deg, #27ae60, #16a085);
      --team3-border: #2ecc71;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .background-shapes {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      opacity: 0.5;
      background-image:
        radial-gradient(circle at 15% 50%, rgba(142, 68, 173, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 85% 30%, rgba(41, 128, 185, 0.1) 0%, transparent 50%);
    }

    .header {
      margin-top: 40px;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .header h1 {
      font-size: 3rem;
      margin: 0;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    .header h2 {
      font-size: 1.5rem;
      margin: 10px 0 0 0;
      color: #e056fd;
      text-shadow: 0 0 10px rgba(224, 86, 253, 0.5);
    }

    .leaderboard-container {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 20px;
      margin-top: 100px;
      height: 400px;
    }

    .team-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      border-radius: 16px;
      padding: 20px;
      width: 200px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      position: relative;
      transition: all 0.3s ease;
    }

    .team-card .team-icon {
      font-size: 3rem;
      margin-bottom: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid rgba(255,255,255,0.2);
    }

    .team-card .team-name {
      font-weight: bold;
      font-size: 1.2rem;
      text-transform: uppercase;
      margin-bottom: 5px;
      text-align: center;
    }

    .team-card .team-points {
      font-size: 4rem;
      font-weight: 900;
      line-height: 1;
      margin-bottom: 5px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }

    .team-card .points-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: 0.8;
      margin-bottom: 15px;
    }

    /* Rank 1 (Center, Biggest) */
    .rank-1 {
      height: 380px;
      width: 240px;
      background: linear-gradient(180deg, #1e3c72, #2a5298);
      border: 3px solid #f1c40f;
      box-shadow: 0 0 30px rgba(241, 196, 15, 0.4);
      z-index: 10;
      transform: translateY(-20px);
    }

    .rank-1 .team-icon {
      font-size: 4rem;
      width: 100px;
      height: 100px;
      border-color: #f1c40f;
      background: linear-gradient(135deg, rgba(241, 196, 15, 0.2), rgba(243, 156, 18, 0.2));
    }

    .rank-1 .team-points {
      font-size: 5rem;
      color: #ffffff;
    }

    /* Rank 2 (Left) */
    .rank-2 {
      height: 320px;
      background: linear-gradient(180deg, #c0392b, #8e44ad);
      border: 2px solid #e74c3c;
    }

    /* Rank 3 (Right) */
    .rank-3 {
      height: 300px;
      background: linear-gradient(180deg, #27ae60, #16a085);
      border: 2px solid #2ecc71;
    }

    /* Fallbacks for more than 3 teams */
    .rank-other {
      height: 280px;
      background: linear-gradient(180deg, #34495e, #2c3e50);
      border: 2px solid #7f8c8d;
      opacity: 0.8;
    }

    .avatar-group {
      display: flex;
      margin-top: auto;
    }

    .avatar-group div {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background-color: #ccc;
      margin-left: -8px;
      border: 2px solid #222;
    }
    .avatar-group div:first-child { margin-left: 0; }
  </style>
</head>
<body>

  <div class="background-shapes"></div>

  <div class="header">
    <h1 id="game-title">QUIZ BATTLE</h1>
    <h2>SCOREBOARD</h2>
  </div>

  <div class="leaderboard-container" id="leaderboard">
    <!-- Teams will be injected here via JS -->
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const leaderboardEl = document.getElementById('leaderboard');
    const gameTitleEl = document.getElementById('game-title');

    socket.on('state_update', (state) => {
      renderLeaderboard(state);
    });

    function renderLeaderboard(state) {
      if (state.settings && state.settings.gameTitle) {
        gameTitleEl.textContent = state.settings.gameTitle.toUpperCase();
      }

      // Sort teams by points descending
      const sortedTeams = [...state.teams].sort((a, b) => b.points - a.points);

      leaderboardEl.innerHTML = '';

      if (sortedTeams.length === 0) return;

      // The layout design usually places 2nd place on the left, 1st place in the middle, and 3rd place on the right.
      // Let's create an ordered array for the visual layout
      let visualOrder = [];

      if (sortedTeams.length >= 3) {
        visualOrder = [
          { ...sortedTeams[1], rankClass: 'rank-2' },
          { ...sortedTeams[0], rankClass: 'rank-1' },
          { ...sortedTeams[2], rankClass: 'rank-3' }
        ];

        // Append any remaining teams
        for (let i = 3; i < sortedTeams.length; i++) {
          visualOrder.push({ ...sortedTeams[i], rankClass: 'rank-other' });
        }
      } else if (sortedTeams.length === 2) {
        visualOrder = [
          { ...sortedTeams[1], rankClass: 'rank-2' },
          { ...sortedTeams[0], rankClass: 'rank-1' }
        ];
      } else if (sortedTeams.length === 1) {
        visualOrder = [
          { ...sortedTeams[0], rankClass: 'rank-1' }
        ];
      }

      visualOrder.forEach(team => {
        const card = document.createElement('div');
        card.className = `team-card ${team.rankClass}`;

        // Mock avatars for visual completion matching the prototype
        const avatars = [1,2,3,4].map(() =>
          `<div style="background-color: hsl(${Math.random() * 360}, 70%, 70%)"></div>`
        ).join('');

        // Add a trophy icon for the first place
        const isFirst = team.rankClass === 'rank-1';

        card.innerHTML = `
          <div class="team-icon">${team.icon}</div>
          <div class="team-name">TEAM<br/>${team.name}</div>
          <div class="team-points">${team.points} ${isFirst ? '🏆' : ''}</div>
          <div class="points-label">POINTS</div>
          <div class="avatar-group">${avatars}</div>
        `;

        leaderboardEl.appendChild(card);
      });
    }
  </script>
</body>
</html>
